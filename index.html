<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>بازی نجار ماهر</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #2c3e50; color: white; font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        h1 { color: #f39c12; margin-bottom: 10px; font-size: 24px; }
        .stats { display: flex; gap: 20px; font-size: 18px; margin-bottom: 20px; }
        .game-area { position: relative; width: 120px; height: 400px; background-color: #8e6d57; border: 5px solid #5c4033; border-radius: 10px; margin-bottom: 20px; overflow: hidden; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .target-zone { position: absolute; width: 100%; height: 60px; background-color: rgba(46, 204, 113, 0.7); top: 170px; border-top: 2px dashed #fff; border-bottom: 2px dashed #fff; }
        .saw-blade { position: absolute; width: 110%; height: 12px; background-color: #bdc3c7; left: -5%; box-shadow: 0 0 10px #fff; transition: top 0.05s linear; border-radius: 2px; }
        .saw-teeth { position: absolute; width: 100%; height: 4px; background-color: #7f8c8d; bottom: 0; }
        button { padding: 15px 40px; font-size: 22px; font-weight: bold; background-color: #e74c3c; color: white; border: none; border-radius: 50px; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.3); font-family: Arial; }
        button:active { transform: scale(0.95); background-color: #c0392b; }
        #message { margin-top: 20px; font-size: 20px; font-weight: bold; height: 30px; text-align: center; }
    </style>
</head>
<body>
    <h1>🪚 بازی نجار ماهر 🪵</h1>
    <div class="stats">
        <span>امتیاز: <span id="score" style="color:#2ecc71;">0</span></span>
        <span>جون: <span id="lives" style="color:#e74c3c;">3</span></span>
    </div>
    <div class="game-area">
        <div class="target-zone" id="targetZone"></div>
        <div class="saw-blade" id="sawBlade" style="top: 0px;">
            <div class="saw-teeth"></div>
        </div>
    </div>
    <button id="cutBtn" onclick="cutWood()">اره بزن!</button>
    <div id="message"></div>

    <script>
        let sawPos = 0; 
        let speed = 5; 
        let direction = 1; 
        let score = 0; 
        let lives = 3; 
        let isPlaying = true; 
        let animationId;
        
        const sawBlade = document.getElementById("sawBlade"); 
        const targetZone = document.getElementById("targetZone"); 
        const scoreEl = document.getElementById("score"); 
        const livesEl = document.getElementById("lives"); 
        const messageEl = document.getElementById("message");
        const cutBtn = document.getElementById("cutBtn");
        
        const gameAreaHeight = 400; 
        const bladeHeight = 12; 
        let targetTop = 170; 
        let targetBottom = 230;

        function moveSaw() {
            if (!isPlaying) return;
            
            sawPos += speed * direction;
            
            if (sawPos >= gameAreaHeight - bladeHeight || sawPos <= 0) { 
                direction *= -1; 
            }
            
            sawBlade.style.top = sawPos + "px";
            animationId = requestAnimationFrame(moveSaw);
        }

        function cutWood() {
            if (!isPlaying) return;
            
            if (sawPos >= targetTop && sawPos <= targetBottom) {
                score++; 
                scoreEl.textContent = score; 
                messageEl.textContent = "✅ برش عالی!"; 
                messageEl.style.color = "#2ecc71"; 
                speed += 0.5; 
                
                targetTop = Math.floor(Math.random() * 250) + 50; 
                targetBottom = targetTop + 60;
                targetZone.style.top = targetTop + "px";
            } else {
                lives--; 
                livesEl.textContent = lives; 
                messageEl.textContent = "❌ اره گیر کرد!"; 
                messageEl.style.color = "#e74c3c";
                
                if (lives <= 0) { 
                    gameOver(); 
                }
            }
        }

        function gameOver() { 
            isPlaying = false; 
            cancelAnimationFrame(animationId); 
            cutBtn.style.display = "none";
            messageEl.innerHTML = `بازی تموم شد!<br>امتیاز نهایی: ${score}<br><button onclick="location.reload()" style="margin-top:15px; font-size:16px; padding:10px 20px; background-color:#3498db;">بازی دوباره</button>`; 
            messageEl.style.color = "#f39c12"; 
        }

        moveSaw();
    </script>
</body>
</html>
